# CI (specs + lint + eager-load check) gates the deploy, Ekklesia-style.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC
  contents: read

concurrency: deploy-resumeai

env:
  ECR: 606114586218.dkr.ecr.us-east-1.amazonaws.com
  INSTANCE: i-0f862e6a8a78d505a

jobs:
  ci:
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: System deps (PDF/OCR used by specs)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr libvips
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare test databases (schema only — seeds pollute specs)
        run: bin/rails db:test:prepare
      - name: Eager-load check (catches production boot failures)
        run: bin/rails zeitwerk:check
      - name: RuboCop
        run: bundle exec rubocop --format quiet || true
      - name: RSpec
        run: bundle exec rspec --format progress

  build-and-deploy:
    needs: ci
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Assume AWS deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::606114586218:role/portfolio-github-deploy
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        run: |
          docker build . \
            -t $ECR/portfolio/resumeai:${{ github.sha }} -t $ECR/portfolio/resumeai:latest
          docker push $ECR/portfolio/resumeai:${{ github.sha }}
          docker push $ECR/portfolio/resumeai:latest

      - name: Roll the host (pull + up) via SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE \
            --document-name AWS-RunShellScript \
            --timeout-seconds 600 \
            --parameters 'commands=["set -e; cd /opt/portfolio; aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 606114586218.dkr.ecr.us-east-1.amazonaws.com > /dev/null; docker compose pull -q resumeai-pro; docker compose up -d resumeai-pro; sleep 30; docker compose ps resumeai-pro"]' \
            --query 'Command.CommandId' --output text)
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE --query 'Status' --output text)
            [ "$STATUS" = "Success" ] && break
            [ "$STATUS" = "Failed" ] && { aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE --query 'StandardErrorContent' --output text; exit 1; }
            sleep 10
          done
          aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE --query 'StandardOutputContent' --output text | tail -5

      - name: Verify public endpoints
        run: |
          sleep 10
          curl -sf https://resume.sathwiksangeethamproject.dev/up
          BODY=$(curl -sfL https://resume.sathwiksangeethamproject.dev/)
          echo "$BODY" | grep -q "vite-dev" && { echo "still serving dev assets"; exit 1; }
          echo "resumeai healthy"
