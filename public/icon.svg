<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: deep blue rounded square -->
  <rect width="512" height="512" rx="100" fill="#1d4ed8"/>

  <!-- Document body (white) -->
  <rect x="108" y="72" width="220" height="288" rx="18" fill="white"/>

  <!-- Document header bar (blue tint) -->
  <rect x="108" y="72" width="220" height="56" rx="18" fill="#3b82f6"/>
  <rect x="108" y="108" width="220" height="20" fill="#3b82f6"/>

  <!-- Header text lines (white) -->
  <rect x="130" y="90" width="90" height="10" rx="5" fill="white" opacity="0.9"/>
  <rect x="130" y="108" width="60" height="8" rx="4" fill="white" opacity="0.6"/>

  <!-- Resume content lines -->
  <rect x="130" y="154" width="176" height="11" rx="5.5" fill="#bfdbfe"/>
  <rect x="130" y="180" width="140" height="11" rx="5.5" fill="#bfdbfe"/>
  <rect x="130" y="206" width="160" height="11" rx="5.5" fill="#bfdbfe"/>

  <!-- Divider -->
  <rect x="130" y="232" width="176" height="2" rx="1" fill="#e2e8f0"/>

  <!-- Second section lines -->
  <rect x="130" y="250" width="176" height="11" rx="5.5" fill="#bfdbfe"/>
  <rect x="130" y="276" width="120" height="11" rx="5.5" fill="#bfdbfe"/>
  <rect x="130" y="302" width="150" height="11" rx="5.5" fill="#bfdbfe"/>

  <!-- Score badge: green circle bottom-right -->
  <circle cx="340" cy="372" r="92" fill="#059669"/>
  <circle cx="340" cy="372" r="80" fill="#10b981"/>

  <!-- "A" grade text -->
  <text x="340" y="406" text-anchor="middle"
        font-family="system-ui,-apple-system,sans-serif"
        font-size="88" font-weight="800" fill="white">A</text>

  <!-- Small plus sign for A+ -->
  <text x="384" y="352" text-anchor="middle"
        font-family="system-ui,-apple-system,sans-serif"
        font-size="44" font-weight="700" fill="white">+</text>

  <!-- Sparkle top-right of document -->
  <path d="M340 100 L346 118 L364 124 L346 130 L340 148 L334 130 L316 124 L334 118 Z"
        fill="#fbbf24"/>
</svg>
