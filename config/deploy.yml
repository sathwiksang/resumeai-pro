# Kamal 2 deployment configuration for ResumeAI Pro
# Deploy: kamal deploy
# Console: kamal console

service: resumeai-pro
image: resumeai-pro

# Deploy targets
servers:
  web:
    hosts:
      - 192.168.1.100
    labels:
      traefik.http.routers.resumeai.rule: Host(`resumeai.local`)
    options:
      memory: 4g
  job:
    hosts:
      - 192.168.1.100
    cmd: bin/jobs
    options:
      memory: 2g

# SSL via Let's Encrypt
# Uncomment and set your domain when ready for production SSL
# proxy:
#   ssl: true
#   host: resumeai.yourdomain.com

# Container registry
registry:
  server: ghcr.io
  username: your-github-username
  password:
    - KAMAL_REGISTRY_PASSWORD

# Environment variables
env:
  secret:
    - RAILS_MASTER_KEY
    - RESUMEAI_PRO_DATABASE_PASSWORD
    - STRIPE_SECRET_KEY
    - STRIPE_WEBHOOK_SECRET
  clear:
    RAILS_ENV: production
    RAILS_LOG_LEVEL: info
    OLLAMA_URL: http://192.168.1.100:11434
    DB_HOST: resumeai-pro-db
    RAILS_SERVE_STATIC_FILES: true

# Aliases
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Persistent storage
volumes:
  - "resumeai_pro_storage:/rails/storage"

# Bridge assets between deploys
asset_path: /rails/public/assets

# ARM64 builder for Mac Mini M4 Pro
builder:
  arch: arm64
  cache:
    type: gha

# Accessories
accessories:
  db:
    image: pgvector/pgvector:pg17
    host: 192.168.1.100
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_DB: resumeai_pro_production
        POSTGRES_USER: resumeai_pro
      secret:
        - RESUMEAI_PRO_DATABASE_PASSWORD
    directories:
      - resumeai_pgdata:/var/lib/postgresql/data

  backup:
    image: kartoza/pg-backup:16-3.4
    host: 192.168.1.100
    env:
      clear:
        POSTGRES_HOST: resumeai-pro-db
        POSTGRES_DB: resumeai_pro_production
        POSTGRES_USER: resumeai_pro
        CRON_SCHEDULE: "0 2 * * *"
      secret:
        - RESUMEAI_PRO_DATABASE_PASSWORD
    directories:
      - resumeai_backups:/backups
